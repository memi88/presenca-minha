<style>
        /* Minimalist dot grid for the text area */
        .dot-grid {
            background-image: radial-gradient(var(--tw-colors-outline-warm) 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: 0 0;
            opacity: 0.3;
        }
        
        /* Ensure placeholder inherits font properties */
        textarea::placeholder {
            color: var(--tw-colors-outline-variant);
            font-style: italic;
        }

        /* Custom Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: var(--tw-colors-primary-fixed);
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: var(--tw-colors-primary-fixed);
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
            border-color: white;
        }
        .toggle-label {
            width: 44px;
            height: 24px;
            background-color: var(--tw-colors-surface-variant);
            border-radius: 9999px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .toggle-label:after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background-color: var(--tw-colors-primary);
            border-radius: 50%;
            transition: transform 0.3s;
        }
    </style>

<!-- Using ink-warm as base to create the requested "ambiente escuro" while respecting the palette tokens -->
<body class="bg-ink-warm text-inverse-on-surface h-screen w-full overflow-hidden relative font-body-md antialiased selection:bg-primary-fixed selection:text-primary">
<!-- Ambient Texture Background -->
<div class="absolute inset-0 z-0 pointer-events-none">
<div class="w-full h-full bg-cover bg-center opacity-40 mix-blend-overlay grayscale-[10%]" style="background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuBlGhra_DgMIL_3nBd19WBqktCG-pXTtORThIApoUXWjVT1dX55JSAlvTPzua5cspkdVQDO6pvkIKkzYvnN00I5KKPWLo01mziAxZMjFqJVF7aQ-JE9Z9831Ef1V_01rUJ4mU_kqaR87DFaKlxNkn8tYyXzshzyNAEimlfQQWmG9za56In2G3OmToKxo22JcTwuaiZ7C1_WOqUQ52r1TS-VPPp-gU9Kq6QXthC3WSQhUbyx-cJSJprQPpuKUABC1ijJ0fg&quot;);"></div>
<!-- Gradient overlay to ensure text legibility and warm tone -->
<div class="absolute inset-0 bg-gradient-to-b from-ink-warm/60 via-ink-warm/40 to-ink-warm/70"></div>
</div>
<!-- Main Content Container (Glassmorphism structural overlay) -->
<main class="relative z-10 h-full w-full flex flex-col px-margin-mobile py-8 max-w-max-content-width mx-auto">
<!-- Header (Transactional - Close only) -->
<header class="flex justify-end w-full pb-8">
<button aria-label="Fechar diário" class="p-2 rounded-full hover:bg-surface-variant/10 transition-colors duration-300 text-inverse-on-surface/70 hover:text-inverse-on-surface">
<span class="material-symbols-outlined" data-icon="close" style="font-variation-settings: 'wght' 300;">close</span>
</button>
</header>
<!-- Central Introspective Area -->
<section class="flex-grow flex flex-col justify-center max-w-2xl mx-auto w-full gap-section-gap">
<!-- Central Question -->
<div class="space-y-4 text-center md:text-left">
<h1 class="font-display-lg-mobile text-display-lg-mobile italic text-primary-fixed font-light tracking-wide drop-shadow-sm">
                    Como foi seu sono hoje?
                </h1>
<p class="font-body-md text-body-md text-inverse-on-surface/60">
                    Sinta-se livre para registrar detalhes ou apenas pensamentos soltos.
                </p>
</div>
<!-- Minimalist Writing Area -->
<div class="relative w-full flex-grow max-h-[40vh]">
<div class="absolute inset-0 dot-grid pointer-events-none"></div>
<textarea class="w-full h-full bg-transparent border-none resize-none focus:ring-0 p-4 font-body-lg text-body-lg text-inverse-on-surface/90 leading-relaxed z-10 relative scrollbar-hide" spellcheck="false"></textarea>
</div>
</section>
<!-- Footer Actions -->
<footer class="mt-auto pt-8 flex flex-col md:flex-row items-center justify-between gap-element-gap w-full max-w-2xl mx-auto border-t border-outline-warm/20">
<!-- Discreet Toggle -->
<div class="flex items-center gap-3">
<div class="relative inline-block w-11 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer opacity-0 z-10" id="shareToggle" name="toggle" type="checkbox">
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer" for="shareToggle"></label>
</div>
<label class="font-label-md text-label-md text-inverse-on-surface/70 cursor-pointer hover:text-inverse-on-surface transition-colors" for="shareToggle">
                    compartilhar com Dr. Arnaldo
                </label>
</div>
<!-- Primary Action Button -->
<button class="w-full md:w-auto bg-primary-fixed text-on-primary-fixed font-button text-button px-8 py-3 rounded-full hover:bg-primary-fixed-dim transition-all duration-300 shadow-[0_4px_20px_rgba(255,221,177,0.15)] active:scale-95 flex items-center justify-center gap-2">
<span>Guardar</span>
<span class="material-symbols-outlined text-[18px]" data-icon="check" data-weight="fill">check</span>
</button>
</footer>
</main>
<!-- Suppressed Navigation Shells: This is a task-focused, transactional screen (Diary Entry).

         BottomNavBar and TopAppBar are intentionally excluded to prioritize the 
         content canvas and introspective flow. -->
