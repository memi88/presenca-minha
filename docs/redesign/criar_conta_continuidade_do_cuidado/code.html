<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Decorative organic shape background -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0 flex items-center justify-center opacity-40">
<div class="w-[120vw] h-[120vw] md:w-[80vw] md:h-[80vw] rounded-full bg-surface-container-high blur-3xl mix-blend-multiply"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md flex flex-col items-center">
<!-- Icon / Brand Mark -->
<div class="mb-section-gap flex justify-center w-full">
<span class="material-symbols-outlined text-surface-tint text-5xl font-light" data-icon="auto_stories">
                auto_stories
            </span>
</div>
<!-- Header -->
<header class="text-center mb-8 flex flex-col gap-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">
                Garantir seu espaço
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">
                Isso garante que tudo que você já escreveu continue seu, mesmo se trocar de aparelho.
            </p>
</header>
<!-- Form Container -->
<form class="w-full flex flex-col gap-element-gap bg-surface-container-low p-6 rounded-xl border border-outline-variant shadow-sm backdrop-blur-sm relative overflow-hidden">
<!-- Subtle gradient overlay -->
<div class="absolute inset-0 bg-gradient-to-br from-surface-bright/50 to-transparent pointer-events-none"></div>
<div class="relative z-10 flex flex-col gap-4">
<!-- Google SSO Button -->
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 bg-surface-container-lowest border border-outline-variant rounded text-on-surface font-button text-button hover:bg-surface-container-highest transition-colors duration-300" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>

</svg>
                    Continuar com Google
                </button>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-outline-warm uppercase tracking-wider">ou</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Input Fields -->
<div class="flex flex-col gap-4">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">E-mail</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline-warm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-300" id="email" placeholder="seu@email.com" type="email"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="password">Senha</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline-warm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-300 pr-10" id="password" placeholder="Mínimo 8 caracteres" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-warm hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
</div>

<button class="w-full mt-4 bg-primary text-on-primary font-button text-button py-3 px-6 rounded-full hover:bg-primary-container hover:text-on-primary-container transition-all duration-300 shadow-sm active:scale-[0.98]" type="submit">

                </button>
</div>

<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary underline decoration-outline-variant underline-offset-4 hover:decoration-primary transition-all duration-300" href="#">
                agora não
            </a>
